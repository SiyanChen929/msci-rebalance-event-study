[project]
name = "msci-rebalance-event-study"
version = "0.1.0"
description = "Point-in-time research pipeline for MSCI USA rebalance execution effects"
requires-python = ">=3.11"
authors = [{ name = "Siyan Chen", email = "siyan_chen@ucsb.edu" }]
license = { text = "MIT" }
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

